<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu</title>
  <link rel="stylesheet" href="tv.css">
</head>
<body>
  <div id="tv" class="tv">
    <header class="tv-head">
      <img class="tv-logo" alt="" hidden>
      <div class="tv-brand">
        <h1 class="tv-name"></h1>
        <p class="tv-tagline"></p>
      </div>
      <div class="tv-clock" aria-hidden="true"></div>
    </header>
    <main class="tv-body"></main>
    <aside class="tv-promo" hidden></aside>
    <footer class="tv-foot">
      <span class="tv-contact"></span>
      <span class="tv-pager"></span>
    </footer>
  </div>
  <p id="tv-error" class="tv-error" hidden></p>

  <script src="shared.js"></script>
  <script src="templates.js"></script>
  <script src="tv.js"></script>
</body>
</html>
